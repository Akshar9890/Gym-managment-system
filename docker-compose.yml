version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: bsf_gym_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bsfgym
      POSTGRES_PASSWORD: bsfgympassword
      POSTGRES_DB: bsfgym
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bsfgym -d bsfgym"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bsf_gym_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.local
    environment:
      DATABASE_URL: "postgresql://bsfgym:bsfgympassword@db:5432/bsfgym"
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/.next

  # Cron scheduler — runs membership-lifecycle-job daily
  # Calls the internal API endpoint secured with JOB_SECRET
  scheduler:
    image: alpine:latest
    container_name: bsf_gym_scheduler
    restart: unless-stopped
    depends_on:
      - app
    environment:
      JOB_SECRET: ${JOB_SECRET}
      APP_URL: "http://app:3000"
    command: >
      sh -c "
        apk add --no-cache curl &&
        echo '${JOB_CRON_SCHEDULE:-0 1 * * *} curl -sf -X POST \$APP_URL/api/jobs/membership-lifecycle -H \"Authorization: Bearer \$JOB_SECRET\" || echo \"Job failed at \$(date)\"' > /etc/crontabs/root &&
        crond -f -l 2
      "

volumes:
  postgres_data:
    name: bsf_gym_postgres_data
